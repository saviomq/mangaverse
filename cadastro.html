<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criar conta – Mangáverso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="blue phead" data-k="新"><div id="nav"></div>
<div class="wrap"><h1>Criar conta</h1><p>Cadastre-se e escolha seu plano de assinatura.</p></div></header>
<main><form class="auth" id="f" novalidate>
<h2>Crie sua conta</h2>
<label for="nm">Nome</label><input id="nm" type="text" autocomplete="name" required>
<label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required>
<label for="pw">Senha (mínimo 8 caracteres)</label><input id="pw" type="password" autocomplete="new-password" required>
<label for="pw2">Repita a senha</label><input id="pw2" type="password" autocomplete="new-password" required>
<label class="chk" for="ok"><input id="ok" type="checkbox"> Li e aceito os termos de uso e a política de privacidade.</label>
<p class="err" id="err" role="alert"></p>
<button class="btn" id="go" type="submit">Criar conta e ver planos</button>
<p class="alt">Já tem conta? <a href="login.html">Entrar</a></p>
</form></main>
<div id="foot"></div>
<script src="app.js"></script>
<script>
if(MV.me())location.replace('planos.html');
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),er=$('#err');er.textContent='';er.style.color='';
  const nm=$('#nm').value.trim(),em=$('#em').value.trim(),pw=$('#pw').value;
  if(nm.length<2)return er.textContent='Informe seu nome.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return er.textContent='Informe um e-mail válido.';
  if(pw.length<8)return er.textContent='A senha precisa ter pelo menos 8 caracteres.';
  if(pw!==$('#pw2').value)return er.textContent='As senhas não coincidem.';
  if(!$('#ok').checked)return er.textContent='Aceite os termos para continuar.';
  b.disabled=true;
  try{const r=await MV.register(nm,em,pw);if(r&&r.confirm){er.style.color='#0a8f3c';er.textContent='Conta criada! Enviamos um e-mail de confirmação. Confirme e depois entre.';b.disabled=false;return}location.href='planos.html'}
  catch(x){er.textContent=x.message;b.disabled=false}};
</script>
</body>
</html>
